<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="container header__inner">
    <a class="brand" routerLink="/" fragment="inicio" (click)="closeMenu()" [attr.aria-label]="copy.ui.actions.backToTop">
      @if (!logoFailed()) {
        <img
          class="brand__logo"
          src="images/logo-160.webp"
          alt=""
          width="40"
          height="40"
          (error)="logoFailed.set(true)"
        />
      } @else {
        <span class="brand__mark" aria-hidden="true">PQ</span>
      }
      <span class="brand__text">
        <strong>Paulo Quenta</strong>
        <small>{{ copy.ui.labels.brandTag }}</small>
      </span>
    </a>

    <nav class="nav" [attr.aria-label]="copy.ui.navLabel">
      @for (link of links; track link.id) {
        <a
          [routerLink]="['/']"
          [fragment]="link.id"
          [class.active]="activeSection() === link.id"
          [attr.aria-current]="activeSection() === link.id ? 'location' : null"
          (click)="closeMenu()"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="header__actions">
      <div class="lang-switch" role="group" aria-label="Idioma / Language">
        <button
          type="button"
          [class.is-active]="i18n.lang() === 'es'"
          [attr.aria-pressed]="i18n.lang() === 'es'"
          (click)="i18n.setLang('es')"
        >
          ES
        </button>
        <button
          type="button"
          [class.is-active]="i18n.lang() === 'en'"
          [attr.aria-pressed]="i18n.lang() === 'en'"
          (click)="i18n.setLang('en')"
        >
          EN
        </button>
      </div>

      <app-theme-toggle></app-theme-toggle>
      <button
        type="button"
        class="menu-button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        [attr.aria-label]="menuOpen() ? copy.ui.menuClose : copy.ui.menuOpen"
        aria-controls="mobile-menu"
      >
        <app-icon [name]="menuOpen() ? 'close' : 'menu'" [size]="21"></app-icon>
      </button>
    </div>
  </div>

  @if (menuOpen()) {
    <div id="mobile-menu" class="mobile-menu">
      <nav [attr.aria-label]="copy.ui.navLabel">
        @for (link of links; track link.id) {
          <a
            [routerLink]="['/']"
            [fragment]="link.id"
            [class.active]="activeSection() === link.id"
            [attr.aria-current]="activeSection() === link.id ? 'location' : null"
            (click)="closeMenu()"
          >
            {{ link.label }}
          </a>
        }
      </nav>
      <a class="btn btn--primary mobile-menu__cta" routerLink="/" fragment="contacto" (click)="closeMenu()">
        {{ copy.ui.actions.contact }}
        <app-icon name="arrow-right" [size]="17"></app-icon>
      </a>
    </div>
  }
</header>
