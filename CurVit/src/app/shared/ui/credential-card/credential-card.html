<button
  type="button"
  class="credential-card"
  (click)="open.emit(credential())"
  [attr.aria-label]="copy.ui.labels.credentialDetailPrefix + credential().title"
>
  <span class="credential-card__media">
    @if (credential().image && !imageFailed()) {
      <img
        [src]="credential().image"
        [alt]="credential().imageAlt ?? credential().title"
        loading="lazy"
        decoding="async"
        (error)="imageFailed.set(true)"
      />
    } @else {
      <span class="credential-card__initials" aria-hidden="true">
        {{ credential().initials }}
      </span>
    }

    @if (credential().pending) {
      <span class="credential-card__pending">{{ copy.ui.labels.credentialPending }}</span>
    }
  </span>

  <span class="credential-card__body">
    <span class="credential-card__meta">
      <span class="credential-card__kind">{{ kindLabel }}</span>
      <span>{{ credential().meta }}</span>
    </span>

    <span class="credential-card__title">{{ credential().title }}</span>
    <span class="credential-card__issuer">{{ credential().issuer }}</span>
    <span class="credential-card__description">{{ credential().description }}</span>

    <span class="credential-card__cta">
      {{ copy.ui.actions.viewDetail }}
      <app-icon name="arrow-right" [size]="15"></app-icon>
    </span>
  </span>
</button>
