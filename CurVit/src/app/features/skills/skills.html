<section id="habilidades" class="section">
  <app-data-backdrop></app-data-backdrop>

  <div class="container">
    <app-section-header
      [eyebrow]="copy.sections.skills.eyebrow"
      [title]="copy.sections.skills.title"
      [description]="copy.sections.skills.description"
    ></app-section-header>

    <div class="skills__grid">
      @for (group of groups; track group.title) {
        <article class="skill-group" appReveal>
          <header class="skill-group__header">
            <span class="skill-group__icon" aria-hidden="true">
              <app-icon [name]="group.icon" [size]="20"></app-icon>
            </span>
            <div>
              <h3>{{ group.title }}</h3>
              <p>{{ group.description }}</p>
            </div>
          </header>

          <ul class="skill-group__list">
            @for (skill of group.skills; track skill.name) {
              <li class="skill" [style.--skill-color]="skill.color">
                <div class="skill__top">
                  <span class="skill__identity">
                    <span class="skill__icon" aria-hidden="true">
                      <app-icon [name]="skill.icon" [size]="17"></app-icon>
                    </span>
                    <span class="skill__name">{{ skill.name }}</span>
                  </span>
                  <span class="skill__level">{{ levelLabel(skill.level) }}</span>
                </div>

                <span class="skill__bar" role="img" [attr.aria-label]="levelLabel(skill.level)">
                  <span class="skill__bar-fill" [style.width.%]="barWidth(skill.level)"></span>
                </span>

                @if (skill.description) {
                  <p class="skill__description">{{ skill.description }}</p>
                }
              </li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>
