<section id="sobre-mi" class="section">
  <div class="container">
    <app-section-header
      [eyebrow]="copy.sections.about.eyebrow"
      [title]="copy.sections.about.title"
      [description]="copy.sections.about.description"
    ></app-section-header>

    <div class="about__grid">
      <div class="about__text" appReveal>
        @for (paragraph of profile.summary; track paragraph) {
          <p>{{ paragraph }}</p>
        }

        <blockquote class="about__quote">
          “{{ profile.quote }}”
          <span>{{ copy.about.quoteLabel }}</span>
        </blockquote>
      </div>

      <aside class="facts" appReveal [attr.aria-label]="copy.ui.labels.quickFacts">
        <p class="facts__title">{{ copy.about.factsTitle }}</p>
        <dl class="facts__list">
          @for (fact of profile.facts; track fact.label) {
            <div class="facts__item">
              <span class="facts__icon" aria-hidden="true">
                <app-icon [name]="fact.icon" [size]="18"></app-icon>
              </span>
              <div>
                <dt>{{ fact.label }}</dt>
                <dd>{{ fact.value }}</dd>
              </div>
            </div>
          }
        </dl>
      </aside>
    </div>
  </div>
</section>
