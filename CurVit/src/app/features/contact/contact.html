<section id="contacto" class="section section--contact">
  <div class="container">
    <app-section-header
      [eyebrow]="copy.sections.contact.eyebrow"
      [title]="copy.sections.contact.title"
      [description]="copy.sections.contact.description"
    ></app-section-header>

    <div class="contact-card" appReveal>
      <div class="contact-card__intro">
        <p class="contact-card__eyebrow">{{ copy.contact.available }}</p>
        <h3>{{ copy.contact.title }}</h3>
        <p>{{ copy.contact.body }}</p>

        <ul class="contact-card__facts">
          <li>
            <app-icon name="map-pin" [size]="16"></app-icon>
            {{ profile.location }}
          </li>
          <li>
            <app-icon name="briefcase" [size]="16"></app-icon>
            {{ profile.availability }}
          </li>
          <li>
            <app-icon name="clock" [size]="16"></app-icon>
            {{ copy.contact.timezone }}
          </li>
        </ul>
      </div>

      <div class="contact-card__actions">
        <button type="button" class="btn btn--light contact-card__cv" (click)="downloadCv()">
          <app-icon name="download" [size]="17"></app-icon>
          {{ copy.ui.actions.downloadCv }}
        </button>

        <a class="btn btn--ghost-light" [href]="'mailto:' + profile.email">
          <app-icon name="mail" [size]="17"></app-icon>
          {{ profile.email }}
        </a>

        <button type="button" class="btn btn--ghost-light" (click)="copyEmail()">
          <app-icon [name]="copied() ? 'check' : 'mail'" [size]="17"></app-icon>
          {{ copied() ? copy.ui.actions.copied : copy.ui.actions.copyEmail }}
        </button>

        <div class="contact-card__social" [attr.aria-label]="copy.ui.labels.socialAria">
          <app-social-links [links]="profile.social" [showLabels]="true"></app-social-links>
        </div>

        <p class="contact-card__hint" aria-live="polite">
          @if (copied()) {
            {{ copy.contact.copiedHint }}
          }
        </p>
      </div>
    </div>
  </div>
</section>
