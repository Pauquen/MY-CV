<section id="proyectos" class="section section--alt">
  <div class="container">
    <app-section-header
      [eyebrow]="copy.sections.projects.eyebrow"
      [title]="copy.sections.projects.title"
      [description]="copy.sections.projects.description"
    ></app-section-header>

    <div class="projects__grid">
      @for (project of projects; track project.title) {
        <div class="projects__item" [class.projects__item--featured]="project.featured" appReveal>
          <app-project-card [project]="project"></app-project-card>
        </div>
      }
    </div>

    <p class="projects__note" appReveal>
      {{ copy.projectsNote.before }}
      <a href="#contacto">{{ copy.projectsNote.link }}</a
      >{{ copy.projectsNote.after }}
    </p>
  </div>
</section>
